[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bardo"
version = "0.1.0"
description = "Self-hosted music library janitor and AI playlist builder for Navidrome / Subsonic servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Bardo contributors" }]
keywords = ["navidrome", "subsonic", "beets", "playlists", "ollama", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
janitor = ["beets>=2.3", "pyacoustid>=1.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "anyio>=4.3", "pyflakes>=3.2"]

[project.scripts]
bardo = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
