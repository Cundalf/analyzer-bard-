[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bardo"
dynamic = ["version"]
description = "Self-hosted music library janitor and AI playlist builder for Navidrome / Subsonic servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Agustín Cundari", email = "acundari95@gmail.com" }]
keywords = ["navidrome", "subsonic", "beets", "playlists", "ollama", "self-hosted", "music"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
janitor = ["beets>=2.3", "pyacoustid>=1.3"]
lyrics = ["py3langid>=0.3"]
audio = ["librosa>=0.10", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "anyio>=4.3", "ruff>=0.6"]

[project.scripts]
bardo = "app.cli:main"

[project.urls]
Homepage = "https://github.com/Cundalf/analyzer-bard-"
Repository = "https://github.com/Cundalf/analyzer-bard-"
Issues = "https://github.com/Cundalf/analyzer-bard-/issues"
Changelog = "https://github.com/Cundalf/analyzer-bard-/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # reglas propias de ruff
  "PTH",  # pathlib
  "T20",  # prints (deben ser explícitos)
]
ignore = [
  # Degradar sin romper es intencional en todo el pipeline (red, disco, LLM).
  "BLE001",
  # Los subprocess del Janitor inspeccionan returncode a mano.
  "PLW1510",
  # Los tests usan prints y dicts mutables como fakes a propósito.
  "T20",
  "RUF012",
  "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Los tests priorizan claridad: SQL inline, nombres largos y fakes simples.
"tests/*" = ["PTH", "SIM", "B", "RUF", "E501", "C4"]
"app/janitor/bardo.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
