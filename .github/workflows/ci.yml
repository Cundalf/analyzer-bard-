name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check app tests
      - name: Ruff format
        run: ruff format --check app tests

  config:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate pyproject and compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.host.yml config --quiet
          python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
      - name: Install project with all extras
        run: pip install -e ".[janitor,lyrics,audio,dev]"
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bardo:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name bardo-ci -p 8080:8080 \
            -e SUBSONIC_URL=http://127.0.0.1:1 \
            -e OLLAMA_URL=http://127.0.0.1:1 \
            bardo:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "health endpoint OK"
              docker rm -f bardo-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not respond in time"
          docker logs bardo-ci
          docker rm -f bardo-ci >/dev/null
          exit 1
